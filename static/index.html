.btn.sm{padding:6px 10px;margin:0 4px 0 0;font-size:13px}.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

lass",pupLbl:"Student",noPupils:"The student list is empty. Import it from Excel in the Students tab or type the name manually."}};

const fmt=x=>new Date(x*1000).toLocaleString(LOC[lang],{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
function toast(x){const e=$('toast');e.textContent=x;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2500)}
async function api(path,method='GET',body){
 const r=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:body?JSON.stringify(body):undefined});
 const j=await r.json().catch(()=>({}));
 if(!r.ok){if(r.status===401&&tok)logout();else toast(typeof j.detail==='string'?j.detail:t('fill'));throw 0}
 return j}
async function load(){try{me=await api('me');[D.res,D.books,D.pupils]=await Promise.all([api('reservations'),api('books'),api('pupils')])}catch(e){return}render()}
function logout(){tok='';me=null;localStorage.removeItem('tok');render()}
async function auth(path,body){try{const j=await api(path,'POST',body);tok=j.token;localStorage.setItem('tok',tok);await load()}catch(e){}}
const doLogin=()=>auth('login',{login:g('lg'),parol:$('pw').value});
const doReg=()=>auth('register',{name:g('rn'),fam:g('rf'),vil:$('rv').value,tum:g('rt'),maktab:g('rs'),login:g('lg'),parol:$('pw').value});
async function act(id,a,el){if(el)el.closest('tr').classList.add('go');try{await api(`reservations/${id}/${a}`,'POST');setTimeout(load,a==='took'?0:300)}catch(e){load()}}
async function addBook(){try{await api('books','POST',{title:g('nt'),author:g('na'),total:+g('nn')||1});await load();toast(t('added'))}catch(e){}}
function authView(){const r=mode==='reg';return `<div class="card" style="max-width:440px;margin:0 auto"><h2>${r?t('reg'):t('login')}</h2>
${r?`<div class="row"><div><label>${t('name')}</label><input id="rn"></div><div><label>${t('fam')}</label><input id="rf"></div></div><label>${t('vil')}</label><select id="rv">${VIL.map(x=>`<option value="${x[0]}">${x[LI[lang]]}</option>`).join('')}</select><label>${t('tum')}</label><input id="rt"><label>${t('school')}</label><input id="rs" placeholder="${t('schoolPh')}">`:''}

<button class="btn" onclick="${r?'doReg()':'doLogin()'}">${r?t('reg'):t('login')}</button><button class="btn ghost" onclick="mode='${r?'login':'reg'}';render()">${r?t('haveAcc'):t('newAcc')}</button></div>`}
function resView(){
 const st={band:r=>`<span class="tag">${tf('until',fmt(r.until))}</span>`,olindi:r=>`<span class="tag ${r.late?'bad':'ok'}">${r.late?t('late')+' · ':''}${r.due?tf('until',fmt(r.due)):t('inHand')}</span>`,qaytarildi:()=>`<span class="tag ok">${t('returned')}</span>`,bekor:()=>`<span class="tag">${t('cancelled')}</span>`,muddati:()=>`<span class="tag bad">${t('expired')}</span>`};
 const btn=r=>r.st==='band'?`<button class="btn sm" onclick="act(${r.id},'took',this)">${t('took')}</button><button class="btn sm ghost" onclick="act(${r.id},'cancel',this)">${t('cancel')}</button>`:r.st==='olindi'?`<button class="btn sm" onclick="act(${r.id},'returned',this)">${t('gave')}</button>`:'';
 return `<div class="card"><h2>${t('resTitle')} (${D.res.length})</h2>${D.res.length?`<div class="tbl"><table><tr><th>${t('student')}</th><th>${t('book')}</th><th>${t('status')}</th><th></th></tr>${D.res.map(r=>`<tr><td>${esc(r.name)}${r.cls?`<br><small>${esc(r.cls)}</small>`:''}</td><td>${esc(r.title)}${r.days?`<br><small>${tf('forDays',r.days)}</small>`:''}</td><td>${st[r.st](r)}</td><td>${btn(r)}</td></tr>`).join('')}</table></div>`:`<div class="empty">${t('emptyRes')}</div>`}</div>`}
function booksView(){return `<div class="card"><h2>${t('bImpTitle')}</h2><p class="empty">${t('bImpHint')}</p><input id="bf" type="file" accept=".xlsx,.xls" onchange="importBooks(this)" hidden><button class="btn" onclick="$('bf').click()">${t('impBtn')}</button><button class="btn ghost" onclick="sampleBooks()">${t('sample')}</button></div>
<div class="card"><h2>${t('newBook')}</h2><label>${t('bTitle')}</label><input id="nt"><label>${t('author')}</label><input id="na"><label>${t('copies')}</label><input id="nn" type="number" value="1" min="1"><button class="btn" onclick="addBook()">${t('addBook')}</button></div>

async function lend(){const d=parseInt($('ld').value,10);if(!(d>=1&&d<=60)){toast(t('badDays'));return}
 try{await api('lend','POST',{name:$('lp')?$('lp').value:g('ln'),book_id:+$('lb').value,days:d});tab='res';await load();toast(t('lent'))}catch(e){}}

const NR=/ism|имя|фио|name|quvchi|ученик|student|fio/i,CR=/sinf|класс|class|grade/i;

 return `<div class="card"><h2>${t('impTitle')}</h2><p class="empty">${t('impHint')}</p><input id="xf" type="file" accept=".xlsx,.xls" onchange="importXlsx(this)" hidden><button class="btn" onclick="$('xf').click()">${t('impBtn')}</button><button class="btn ghost" onclick="sample()">${t('sample')}</button></div>
<div class="card"><h2>${t('pupTitle')} (${list.length})</h2><select id="pf" onchange="pf=this.value;render()" style="max-width:220px;margin-bottom:10px"><option value="">${t('allCls')}</option>${cl.map(c=>`<option ${c===pf?'selected':''}>${esc(c)}</option>`).join('')}</select>

const normCls=v=>String(v??'').trim().toUpperCase().replace(/^(\d+)\s*[-–—.]?\s*([A-ZА-ЯЎҚҒҲ].*)$/,'$1-$2').replace(/\s+/g,'');
async function importXlsx(inp){const f=inp.files[0];if(!f)return;const items=[];
 try{const wb=XLSX.read(await f.arrayBuffer());
  for(const sn of wb.SheetNames){const rs=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});if(!rs.length)continue;
   const h=rs[0].map(x=>String(x).toLowerCase());let ni=h.findIndex(x=>NR.test(x)),ci=h.findIndex(x=>CR.test(x)),s=0;
   if(ni>=0||ci>=0){s=1;if(ni<0)ni=ci===0?1:0;if(ci<0)ci=ni===0?1:0}else{ni=0;ci=1}
   for(const r of rs.slice(s)){const n=String(r[ni]??'').trim(),c=normCls(r[ci])||(/^\d/.test(sn)?normCls(sn):'');if(n&&c)items.push({name:n,cls:c})}}
 }catch(e){inp.value='';return toast(t('readErr'))}
 inp.value='';if(!items.length)return toast(t('noRows'));
 try{const j=await api('pupils/import','POST',{items});await load();toast(tf('imported',j.added))}catch(e){}}

const BT=/nom|назв|title|kitob|книг|book/i,BA=/muallif|автор|author/i,BN=/nusxa|soni|кол|экз|copies|count|qty|total/i;
async function importBooks(inp){const f=inp.files[0];if(!f)return;const items=[];
 try{const wb=XLSX.read(await f.arrayBuffer());
  for(const sn of wb.SheetNames){const rs=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});if(!rs.length)continue;
   const h=rs[0].map(x=>String(x).toLowerCase());let a=h.findIndex(x=>BT.test(x)),b=h.findIndex(x=>BA.test(x)),c=h.findIndex(x=>BN.test(x)),s=0;
   if(a>=0||b>=0||c>=0){s=1;if(a<0)a=[0,1,2].find(i=>i!==b&&i!==c)}else{a=0;b=1;c=2}
   for(const r of rs.slice(s)){const ti=String(r[a]??'').trim();if(ti)items.push({title:ti,author:b>=0?String(r[b]??'').trim():'',total:c>=0?(parseInt(r[c],10)||1):1})}}
 }catch(e){inp.value='';return toast(t('readErr'))}
 inp.value='';if(!items.length)return toast(t('bNoRows'));
 try{const j=await api('books/import','POST',{items});await load();toast(tf('bImported',j.added)+(j.skipped?' · '+tf('skipped',j.skipped):''))}catch(e){}}

function setLang(l){const keep={};document.querySelectorAll('#view input,#view select').forEach(e=>e.id&&(keep[e.id]=e.value));
 lang=l;localStorage.setItem('lang',l);render();for(const k in keep){const e=$(k);if(e){e.value=keep[k];if(k==='lc')fillPupils()}}}
