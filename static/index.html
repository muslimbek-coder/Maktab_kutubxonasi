 return j}

async function setLendingBarcode(value){const code=String(value||'').trim();if(!code)return;const book=D.books.find(x=>x.barcode===code);if(!book){toast(t('barcodeMissing'));return}const available=D.books.find(x=>x.id===book.id);if(!available||available.avail<1){toast(t('noBooks'));return}if($('lb'))$('lb').value=String(book.id);toast(t('barcodeFound')+': '+book.title)}
async function startBarcodeScan(){if(!('BarcodeDetector'in window)||!navigator.mediaDevices?.getUserMedia){toast(t('cameraUnsupported'));return}try{const available=await BarcodeDetector.getSupportedFormats(),formats=['qr_code','ean_13','ean_8','code_128','code_39','upc_a','upc_e'].filter(x=>available.includes(x));if(!formats.length){toast(t('cameraUnsupported'));return}const detector=new BarcodeDetector({formats});barcodeStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});const video=$('barcodeVideo');video.srcObject=barcodeStream;await video.play();const scan=async()=>{if(!barcodeStream)return;try{const found=await detector.detect(video);if(found.length){$('lendBarcode').value=found[0].rawValue;await setLendingBarcode(found[0].rawValue);stopBarcodeScan();return}}catch(e){console.error('Barcode scan failed',e)}barcodeTimer=setTimeout(scan,300)};scan()}catch(e){stopBarcodeScan();toast(e.name==='NotAllowedError'?t('cameraDenied'):t('cameraUnsupported'))}}
function stopBarcodeScan(){if(barcodeTimer)clearTimeout(barcodeTimer);barcodeTimer=null;if(barcodeStream){barcodeStream.getTracks().forEach(track=>track.stop());barcodeStream=null}const video=$('barcodeVideo');if(video)video.srcObject=null}
function lendView(){const av=D.books.filter(b=>b.avail>0);return `<div class="card" style="max-width:520px"><h2>${t('lendTitle')}</h2><p class="empty">${t('lendHint')}</p>
${pupPick()}<label>${t('barcode')}</label><div class="row"><input id="lendBarcode" placeholder="${t('barcode')}" onkeydown="if(event.key==='Enter'){event.preventDefault();setLendingBarcode(this.value)}"><button class="btn" onclick="setLendingBarcode($('lendBarcode').value)">${t('barcodeFound')}</button><button class="btn ghost" onclick="startBarcodeScan()">${t('scan')}</button></div><video id="barcodeVideo" playsinline style="width:100%;max-height:240px"></video><button class="btn ghost" onclick="stopBarcodeScan()">${t('stopScan')}</button><label>${t('bookLbl')}</label><select id="lb">${av.length?av.map(b=>`<option value="${b.id}">${esc(b.title)} (${tf('left',b.avail)})</option>`).join(''):`<option value="">${t('noBooks')}</option>`}</select>
<label>${t('daysLbl')}</label><input id="ld" type="number" value="14" min="1" max="60" placeholder="${t('daysPh')}"><button class="btn" onclick="lend()">${t('lendBtn')}</button></div>`}
async function lend(){const d=parseInt($('ld').value,10);if(!(d>=1&&d<=60)){toast(t('badDays'));return}
 const name=$('lp')?$('lp').value:g('ln'),cls=$('lp')?$('lc').value:g('lcls');
 try{const j=await api('lend','POST',{name,cls,book_id:+$('lb').value,days:d});tab='res';await load();toast(t(j.telegram==='sent'?'lentByBot':j.telegram==='not_linked'?'lentUnlinked':j.telegram==='ambiguous'?'lentAmbiguous':'lentFailed'))}catch(e){}}
function exportReport(){if(!D.res.length){toast(t('noReportData'));return}const statusLabel={band:t('reportReserved'),olindi:t('reportBorrowed'),qaytarildi:t('reportReturned'),bekor:t('reportCancelled'),muddati:t('reportOverdue')};const history=D.res.map(r=>({[t('student')]:r.name,[t('cls')]:r.cls||'', [t('book')]:r.title,[t('status')]:r.st==='olindi'&&r.late?t('reportOverdue'):statusLabel[r.st]||r.st,[t('created')]:fmt(r.created),[t('until')]:r.due?fmt(r.due):r.until?fmt(r.until):''}));const perClass={};D.res.forEach(r=>{const cls=r.cls||'—',stats=perClass[cls]||(perClass[cls]={total:0,band:0,olindi:0,qaytarildi:0,late:0,bekor:0});stats.total++;if(r.st in stats)stats[r.st]++;if(r.st==='olindi'&&r.late)stats.late++});const classes=Object.entries(perClass).sort((a,b)=>cmpC(a[0],b[0])).map(([cls,s])=>({[t('reportClass')]:cls,[t('reportBooks')]:s.total,[t('reportReserved')]:s.band,[t('reportBorrowed')]:s.olindi,[t('reportReturned')]:s.qaytarildi,[t('reportOverdue')]:s.late,[t('reportCancelled')]:s.bekor}));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(history),t('reportReservations').slice(0,31));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(classes),t('reportClasses').slice(0,31));XLSX.writeFile(wb,'kutubxona-hisoboti.xlsx')}

const NR=/ism|имя|фио|name|quvchi|ученик|student|fio/i,CR=/sinf|класс|class|grade/i;
const cmpC=(a,b)=>a.localeCompare(b,'en',{numeric:true});
const classes=()=>[...new Set(D.pupils.map(p=>p.cls))].sort(cmpC);
const pupOpts=c=>D.pupils.filter(p=>p.cls===c).sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<option value="${esc(p.name)}">${esc(p.name)}</option>`).join('');

function pupPick(){const cl=classes();
 if(!cl.length)return `<p class="empty">${t('noPupils')}</p><div class="row"><div><label>${t('stLbl')}</label><input id="ln" maxlength="60" placeholder="${t('stPh')}"></div><div><label>${t('clsLbl')}</label><input id="lcls" maxlength="10" placeholder="${t('classPh')}"></div></div>`;
 return `<div class="row"><div><label>${t('clsLbl')}</label><select id="lc" onchange="fillPupils()">${cl.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div><label>${t('pupLbl')}</label><select id="lp">${pupOpts(cl[0])}</select></div></div>`}
function pupilsView(){const cl=classes(),query=(window.pupilSearch||'').toLocaleLowerCase(),list=D.pupils.filter(p=>(!pf||p.cls===pf)&&(!query||`${p.name} ${p.cls}`.toLocaleLowerCase().includes(query))).sort((a,b)=>cmpC(a.cls,b.cls)||a.name.localeCompare(b.name));
 return `<div class="card"><h2>${t('impTitle')}</h2><p class="empty">${t('impHint')}</p><input id="xf" type="file" accept=".xlsx,.xls" onchange="importXlsx(this)" hidden><button class="btn" onclick="$('xf').click()">${t('impBtn')}</button><button class="btn ghost" onclick="sample()">${t('sample')}</button></div>
<div class="card"><h2>${t('pupTitle')} (${list.length})</h2><select id="pf" onchange="pf=this.value;render()" style="max-width:220px;margin-bottom:10px"><option value="">${t('allCls')}</option>${cl.map(c=>`<option ${c===pf?'selected':''}>${esc(c)}</option>`).join('')}</select>
<input id="pupilSearch" placeholder="${t('search')}" value="${esc(window.pupilSearch||'')}" oninput="updateFilter('pupilSearch',this.value)">${list.length?`<div class="tbl"><table><tr><th>${t('cls')}</th><th>${t('student')}</th><th></th></tr>${list.map(p=>`<tr><td><span class="tag">${esc(p.cls)}</span></td><td>${esc(p.name)}</td><td><button class="btn sm ghost" onclick="delPupil(${p.id})">${t('del')}</button></td></tr>`).join('')}</table></div>`:`<div class="empty">${t('noPupils')}</div>`}</div>`}
const normCls=v=>String(v??'').trim().toUpperCase().replace(/^(\d+)\s*[-–—.]?\s*([A-ZА-ЯЎҚҒҲ].*)$/,'$1-$2').replace(/\s+/g,'');
async function importXlsx(inp){const f=inp.files[0];if(!f)return;const items=[];
 try{const wb=XLSX.read(await f.arrayBuffer());
  for(const sn of wb.SheetNames){const rs=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});if(!rs.length)continue;
   const h=rs[0].map(x=>String(x).toLowerCase());let ni=h.findIndex(x=>NR.test(x)),ci=h.findIndex(x=>CR.test(x)),s=0;
   if(ni>=0||ci>=0){s=1;if(ni<0)ni=ci===0?1:0;if(ci<0)ci=ni===0?1:0}else{ni=0;ci=1}
   for(const r of rs.slice(s)){const n=String(r[ni]??'').trim(),c=normCls(r[ci])||(/^\d/.test(sn)?normCls(sn):'');if(n&&c)items.push({name:n,cls:c})}}
 }catch(e){inp.value='';return toast(t('readErr'))}
 inp.value='';if(!items.length)return toast(t('noRows'));
 try{const j=await api('pupils/import','POST',{items});await load();toast(tf('imported',j.added))}catch(e){}}

const BT=/nom|назв|title|kitob|книг|book/i,BA=/muallif|автор|author/i,BG=/janr|жанр|genre/i,BN=/nusxa|soni|кол|экз|copies|count|qty|total/i,BD=/tavsif|описан|description|summary/i,BB=/shtrix|штрих|barcode|isbn|qr/i,BC=/muqova|облож|cover/i;
async function importBooks(inp){const f=inp.files[0];if(!f)return;const items=[];
 try{const wb=XLSX.read(await f.arrayBuffer());
  for(const sn of wb.SheetNames){const rs=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});if(!rs.length)continue;
   const h=rs[0].map(x=>String(x).toLowerCase());let a=h.findIndex(x=>BT.test(x)),b=h.findIndex(x=>BA.test(x)),gidx=h.findIndex(x=>BG.test(x)),c=h.findIndex(x=>BN.test(x)),didx=h.findIndex(x=>BD.test(x)),bc=h.findIndex(x=>BB.test(x)),cv=h.findIndex(x=>BC.test(x)),s=0;
   if(a>=0||b>=0||gidx>=0||c>=0||didx>=0||bc>=0||cv>=0){s=1;if(a<0)a=[0,1,2,3,4].find(i=>![b,gidx,c,didx,bc,cv].includes(i))}else{a=0;b=1;gidx=-1;c=2;didx=-1;bc=-1;cv=-1}
   for(const r of rs.slice(s)){const ti=String(r[a]??'').trim();if(ti)items.push({title:ti,author:b>=0?String(r[b]??'').trim():'',genre:gidx>=0?String(r[gidx]??'').trim():'',total:c>=0?(parseInt(r[c],10)||1):1,description:didx>=0?String(r[didx]??'').trim():'',barcode:bc>=0?String(r[bc]??'').trim():'',cover_url:cv>=0?String(r[cv]??'').trim():''})}}
 }catch(e){inp.value='';return toast(t('readErr'))}
 inp.value='';if(!items.length)return toast(t('bNoRows'));
 try{const j=await api('books/import','POST',{items});await load();const summary=tf('bImported',j.added)+(j.skipped?' · '+tf('skipped',j.skipped):'');j.added&&!j.announced?alert(summary+' · '+t('notAnnounced')):toast(summary)}catch(e){}}

}
